<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presup-factur v017</title>
  <link rel="stylesheet" href="styles.css?v=017">
</head>
<body>
  <main class="app">
    <section class="editor" aria-label="Editor del presupuesto">
      <header class="editor-header">
        <div class="app-title">
          <h1>Presupuestos y Facturas</h1>
          <p>por Lucio J. Martinez</p>
        </div>
        <div class="actions">
          <button type="button" id="newQuoteBtn" class="secondary">Añadir presupuesto</button>
          <button type="button" id="newInvoiceBtn" class="secondary">Añadir factura</button>
          <button type="button" id="restoreQuoteBtn" class="secondary" data-restore-type="PRESUPUESTO">Restaurar Presupuesto</button>
          <button type="button" id="restoreInvoiceBtn" class="secondary" data-restore-type="FACTURA">Restaurar Factura</button>
          <button type="button" id="backupBtn" class="secondary">Guardar</button>
          <button type="button" id="printBtn">Imprimir PDF</button>
          <input id="restoreInput" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <form id="quoteForm" autocomplete="off">
        <fieldset class="type-box">
          <legend>Tipo</legend>
          <div class="type-options" role="radiogroup" aria-label="Tipo de documento">
            <label class="radio-option">
              <input name="docType" type="radio" value="PRESUPUESTO">
              Presupuesto
            </label>
            <label class="radio-option">
              <input name="docType" type="radio" value="FACTURA">
              Factura
            </label>
          </div>
        </fieldset>

        <div class="section-title"><span>Configuración</span></div>

        <details class="foldout">
          <summary>Logo</summary>
          <div class="foldout-body">
            <label>
              Logo
              <input id="logoInput" name="logo" type="file" accept="image/*">
            </label>
            <button type="button" id="defaultLogoBtn" class="secondary wide">Logo original</button>
          </div>
        </details>

        <details class="foldout">
          <summary>Carpetas de trabajo</summary>
          <div class="foldout-body">
            <div class="directory-row">
              <button type="button" class="secondary" data-directory-type="PRESUPUESTO">Carpeta presupuestos</button>
              <span id="quoteDirectoryStatus">No seleccionada</span>
            </div>
            <div class="directory-row">
              <button type="button" class="secondary" data-directory-type="FACTURA">Carpeta facturas</button>
              <span id="invoiceDirectoryStatus">No seleccionada</span>
            </div>
          </div>
        </details>

        <details class="foldout">
          <summary>Datos Empresa</summary>
          <div class="foldout-body">
            <label>
              Nombre comercial
              <input name="companyTitle" type="text">
            </label>
            <label>
              NIF Empresa
              <input name="companyTaxId" type="text">
            </label>
            <label>
              Razón social
              <input name="companyName" type="text">
            </label>
            <label>
              Especialidad
              <input name="companySubtitle" type="text">
            </label>
            <label>
              Dirección y teléfonos
              <textarea name="companyAddress" rows="4"></textarea>
            </label>
          </div>
        </details>

        <div class="section-title"><span>Encabezado</span></div>

        <details class="foldout">
          <summary>Datos Factura/Presupuesto</summary>
          <div class="foldout-body">
            <div class="grid two">
              <label>
                Número
                <input name="docNumber" type="text">
              </label>
              <label>
                Fecha
                <input name="docDate" type="date">
              </label>
              <label>
                Referencia
                <input name="reference" type="text">
              </label>
            </div>
          </div>
        </details>

        <details class="foldout">
          <summary>Datos Cliente</summary>
          <div class="foldout-body">
            <div class="grid two">
              <label>
                Cliente
                <input name="clientName" type="text">
              </label>
              <label>
                Teléfono
                <input name="clientPhone" type="text">
              </label>
              <label>
                N.I.F.
                <input name="clientTaxId" type="text">
              </label>
            </div>
            <label>
              Dirección / notas
              <textarea name="clientInfo" rows="3"></textarea>
            </label>
          </div>
        </details>

        <div class="section-title"><span>Conceptos</span></div>
        <div class="concepts-panel">
          <div id="items" class="items"></div>
          <button type="button" id="addItemBtn" class="wide">Añadir concepto</button>
        </div>

        <details class="section-foldout">
          <summary><span>Totales y condiciones</span></summary>
          <div class="section-foldout-body">
            <div class="grid two">
              <label>
                IVA %
                <input name="taxRate" type="number" min="0" step="0.01">
              </label>
              <label>
                % Dto. factura
                <input name="discountRate" type="number" min="0" step="0.01">
              </label>
              <label>
                Vencimiento
                <input name="dueDate" type="date">
              </label>
              <label>
                Forma de pago
                <input name="paymentMethod" type="text">
              </label>
              <label>
                Entidad
                <input name="bankEntity" type="text">
              </label>
              <label>
                Oficina
                <input name="bankOffice" type="text">
              </label>
              <label>
                D.C.
                <input name="bankControl" type="text">
              </label>
              <label>
                Número de cuenta
                <input name="bankAccount" type="text">
              </label>
              <label>
                Texto inferior
                <input name="footerNote" type="text">
              </label>
            </div>
          </div>
        </details>
      </form>
      <p class="app-version">Versión v017</p>
    </section>

    <section class="preview-wrap" aria-label="Vista previa">
      <div id="printArea" class="print-pages"></div>
    </section>
  </main>

  <template id="itemTemplate">
    <details class="item-row concept-foldout">
      <summary><span data-item-title>Concepto</span></summary>
      <div class="concept-body">
        <label>
          Detalle
          <textarea data-field="description" rows="4"></textarea>
        </label>
        <div class="item-grid">
          <label>
            Unid.
            <input data-field="quantity" type="number" min="0" step="0.01">
          </label>
          <label>
            Precio
            <input data-field="price" type="number" min="0" step="0.01">
          </label>
          <button type="button" class="icon remove-item" title="Eliminar concepto" aria-label="Eliminar concepto">×</button>
        </div>
      </div>
    </details>
  </template>

  <script src="app.js?v=017"></script>
</body>
</html>
